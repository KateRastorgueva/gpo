services:

  # Local services are available on their ports, but also available on:
  # http://api.localhost.tiangolo.com: backend
  # http://dashboard.localhost.tiangolo.com: frontend
  # etc. To enable it, update .env, set:
  # DOMAIN=localhost.tiangolo.com
  proxy:
    image: traefik:3.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "80:80"
      - "8090:8080"
    # Duplicate the command from compose.yml to add --api.insecure=true
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Add a constraint to only use services with the label for this stack
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=DEBUG
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      - traefik-public
      - default

  db:
    restart: "no"
    ports:
      - "5432:5432"

  qdrant:
    restart: "no"
    ports:
      - "6333:6333"

  adminer:
    # Dev-инструмент: не поднимается по умолчанию.
    # Запуск: docker compose --profile tools up -d adminer
    profiles: ["tools"]
    restart: "no"
    ports:
      - "8080:8080"

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - GIT_BRANCH=${GIT_BRANCH:-unknown}
        - BUILD_TIME=${BUILD_TIME:-unknown}
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    environment:
      # SMTP по умолчанию выключен: писем в dev-стеке нет, ничего не стучится
      # в несуществующий mailcatcher. Для проверки писем поднимите профиль mail
      # и задайте SMTP_HOST=mailcatcher (см. docs/testing.md).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TLS: ${SMTP_TLS:-false}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-noreply@example.com}
      # Генерация ответа встроенным поиском (движок legacy) — локальная модель
      # через LM Studio на хосте, если ключ Google не задан.
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-qwen2.5-14b-instruct}

  mailcatcher:
    # Перехватчик писем: только для проверки сброса пароля.
    # Запуск: docker compose --profile mail up -d mailcatcher
    profiles: ["mail"]
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  frontend:
    restart: "no"
    ports:
      - "5173:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://127.0.0.1:8000
        - NODE_ENV=development
    volumes:
      # /api проксируется в backend: фронтенд работает с того же origin (туннель, доступ по IP)
      - ./frontend/nginx-backend-proxy.conf:/etc/nginx/extra-conf.d/backend-not-found.conf:ro

  playwright:
    # E2E-прогон в контейнере: не поднимается по умолчанию.
    # Запуск: docker compose --profile e2e up --abort-on-container-exit playwright
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323

  # Локальный RAG-движок (RAG_PROVIDER=anythingllm / переключатель в админке).
  # Не стартует по умолчанию: docker compose --profile anythingllm up -d anythingllm
  anythingllm:
    image: mintplexlabs/anythingllm:1.20.0
    profiles: ["anythingllm"]
    cap_add:
      - SYS_ADMIN
    ports:
      - "3001:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
      # Модели — локальные, через LM Studio на хосте (OpenAI-совместимый API :1234).
      # Без облака: ключи Google/Gemini не нужны.
      - LLM_PROVIDER=lmstudio
      - LMSTUDIO_BASE_PATH=http://host.docker.internal:1234/v1
      - LMSTUDIO_MODEL_PREF=qwen2.5-14b-instruct
      - LMSTUDIO_MODEL_TOKEN_LIMIT=8192
      - EMBEDDING_ENGINE=lmstudio
      - EMBEDDING_BASE_PATH=http://host.docker.internal:1234/v1
      - EMBEDDING_MODEL_PREF=text-embedding-bge-m3
      # bge-m3 держит длинный контекст: без этого AnythingLLM режет чанки по дефолту
      - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=8192
      - VECTOR_DB=lancedb
      # OCR сканов: по умолчанию eng, русский текст превращается в мусор.
      - TARGET_OCR_LANG=rus,eng
      - DISABLE_TELEMETRY=true
    volumes:
      - anythingllm-storage:/app/server/storage

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false

volumes:
  anythingllm-storage:
