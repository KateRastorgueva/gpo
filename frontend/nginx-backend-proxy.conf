# Локальный стек (compose.override.yml): /api уходит в контейнер backend, поэтому фронтенд
# работает с того же origin, в том числе через туннель или по IP с другого устройства.
# Резолвер Docker и переменная: nginx стартует, даже если backend ещё не поднят.
resolver 127.0.0.11 valid=10s ipv6=off;

location /api {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
    proxy_read_timeout 300s;
}
